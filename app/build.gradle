plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photogram.backup'
    compileSdk 33

    defaultConfig {
        applicationId "com.photogram.backup"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    // Add this for background scheduling:
    implementation "androidx.work:work-runtime:2.8.1"
}