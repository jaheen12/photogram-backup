plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photogram.backup'
    compileSdk 34

    defaultConfig {
        applicationId "com.photogram.backup"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
         
        vectorDrawables.useSupportLibrary = true
         
        // SAFE INJECTION: If the secret is missing, it uses an empty string instead of crashing
        def token = System.getenv("TELEGRAM_BOT_TOKEN") ?: ""
        buildConfigField "String", "BOT_TOKEN", "\"${token}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.json:json:20230227'
}