plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photogram.backup'
    compileSdk 34 // Updated for late 2025 standards

    defaultConfig {
        applicationId "com.photogram.backup"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 1. AndroidX Core (FIXES THE NOTIFICATION ERROR)
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // 2. Automation Engine (Background Sync)
    implementation 'androidx.work:work-runtime:2.8.1'

    // 3. Internet Engine (Telegram Uploads)
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // 4. Data Engine (Reading Telegram responses)
    implementation 'org.json:json:20230227'
}