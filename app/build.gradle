plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photogram.backup'
    compileSdk 33

    defaultConfig {
        applicationId "com.photogram.backup"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OkHttp: Used for sending photos to Telegram API
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    
    // WorkManager: Used for scheduling the background backup every hour
    implementation 'androidx.work:work-runtime:2.8.1'
    
    // JSON: Used for reading Telegram's responses
    implementation 'org.json:json:20230227'
}